<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="theme-color" content="#013175">
  <meta name="description" content="Portal SILABA - Sistem Layanan Akademik SMK Bhakti Nusantara Salatiga">

  <!-- Dukungan Web App Layar Penuh untuk Perangkat iOS & Android -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SILABA">
  <meta name="mobile-web-app-capable" content="yes">

  <title>SILABA - SMK BHAKTI NUSANTARA SALATIGA</title>

  <!-- Favicon Logo Sekolah (Otomatis Muncul di Tab Browser Desktop, Android & iOS) -->
  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1ftuIkgJp71HzAiUHJYKvZ_FPEaGAczni">
  <link rel="shortcut icon" type="image/png" href="https://lh3.googleusercontent.com/d/1ftuIkgJp71HzAiUHJYKvZ_FPEaGAczni">
  <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1ftuIkgJp71HzAiUHJYKvZ_FPEaGAczni">

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #013175;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    /* Layar Pemuatan Awal Sebelum Iframe Google Apps Script Siap */
    #loader {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #013175 0%, #0b57d0 100%);
      color: #ffffff;
      text-align: center;
      padding: 24px;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }

    #loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-logo {
      width: 72px;
      height: 72px;
      object-fit: contain;
      background: #ffffff;
      padding: 10px;
      border-radius: 20px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
      margin-bottom: 18px;
    }

    .spinner {
      width: 34px;
      height: 34px;
      border: 3.5px solid rgba(255, 255, 255, 0.28);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
      margin-bottom: 14px;
    }

    .loader-title {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .loader-sub {
      font-size: 12px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.82);
      margin-top: 4px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Frame Layar Penuh untuk Web App Google Apps Script */
    #app-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      border: none;
      display: block;
      background-color: #ffffff;
    }
  </style>
</head>
<body>

  <!-- Indikator Loading Awal -->
  <div id="loader">
    <img src="https://lh3.googleusercontent.com/d/1ftuIkgJp71HzAiUHJYKvZ_FPEaGAczni" referrerpolicy="no-referrer" alt="Logo SMK Bhakti Nusantara Salatiga" class="loader-logo">
    <div class="spinner"></div>
    <div class="loader-title">Memuat Portal SILABA...</div>
    <div class="loader-sub">SMK Bhakti Nusantara Salatiga</div>
  </div>

  <!-- Iframe Web App Google Apps Script -->
  <iframe
    id="app-frame"
    title="Portal SILABA - SMK Bhakti Nusantara Salatiga"
    allow="clipboard-read; clipboard-write; camera; microphone"
    allowfullscreen>
  </iframe>

  <script>
    (function() {
      var GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzB4J7OcSYoKGKo7IXGYYbLHbgx3Qn-Fgs76br-ST-GORgACbJs63vgrAPH1O6a8qpgEQ/exec";
      var frame = document.getElementById("app-frame");
      var loader = document.getElementById("loader");

      function hideLoader() {
        if (loader && !loader.classList.contains("hidden")) {
          loader.classList.add("hidden");
        }
      }

      if (frame) {
        frame.addEventListener("load", hideLoader);
        frame.src = GAS_WEB_APP_URL;
      }

      // Pengaman agar layar loading tetap terbuka maksimal dalam 6 detik pada jaringan lambat
      setTimeout(hideLoader, 6000);
    })();
  </script>
</body>
</html>
